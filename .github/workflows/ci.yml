# Линтер и тесты на каждый push: настоящий PostgreSQL с pgvector, модель и Telegram — поддельные
name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: assistant
          POSTGRES_PASSWORD: assistant
          POSTGRES_DB: assistant_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://assistant:assistant@localhost:5432/assistant_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run pytest -q
      - name: Миграции на пустой базе совпадают с моделями
        run: uv run alembic upgrade head && uv run alembic check
        env:
          DATABASE_URL: postgresql://assistant:assistant@localhost:5432/postgres
          BOT_TOKEN: "123456:CI"
